<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Student Portal</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="add_student.html">Add Student</a>
    </nav>
</header>

<div class="container">

    <div class="card">

        <h2>Students</h2>

        <a href="add_student.html" class="button">
            + Add Student
        </a>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="student-table">
            </tbody>

        </table>

    </div>

</div>

<script src="api.js"></script>

<script>

async function loadStudents() {

    const students = await getStudents();

    const table = document.getElementById("student-table");

    table.innerHTML = "";

    students.forEach(function(student) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${student.id}</td>
            <td>${student.student_id}</td>
            <td>${student.name}</td>
            <td>${student.email}</td>
            <td>${student.course}</td>
            <td>
                <a
                    href="edit_student.html?id=${student.id}"
                    class="button edit-button"
                >
                    Edit
                </a>

                <button
                    class="button delete-button"
                    onclick="deleteStudentRecord(${student.id})"
                >
                    Delete
                </button>
            </td>
        `;

        table.appendChild(row);
    });
}

async function deleteStudentRecord(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this student?"
    );

    if (!confirmDelete) {
        return;
    }

    const result = await deleteStudent(id);

    alert(result.message);

    loadStudents();
}

loadStudents();

</script>

</body>
</html>
